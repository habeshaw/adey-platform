    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('adey_lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) el.innerText = translations[lang][key];
      });
      if (currentProfile) {
        supabaseClient.from('profiles').update({ preferred_language: lang }).eq('id', currentUser.id);
      }
    }

        currentUser = session.user;

        if (currentProfile.preferred_language) {
          document.getElementById('lang-switcher').value = currentProfile.preferred_language;
          changeLanguage(currentProfile.preferred_language);
        }
        document.getElementById('user-display').innerText = currentProfile.full_name || currentUser.email;
        document.getElementById('user-display').classList.remove('hidden');
        document.getElementById('auth-btn').classList.add('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');

        }

      switchTab('home');

    async function loadLiveRates() {
      const { data: rates, error } = await supabaseClient.from('fx_rates').select('*, fx_sources(source_name)').order('effective_date', { ascending: false }).limit(30);
      const container = document.getElementById('rates-table-container');
      if (error || !rates || rates.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-500">No rates found in database. Click "Run Live Collection Scraper" above to populate rates.</p>';
        return;
      }
      let html = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-slate-100 text-slate-700 text-xs uppercase"><th class="p-3">Institution / Source</th><th class="p-3">Currency</th><th class="p-3">Rate Side</th><th class="p-3 text-right">Rate (ETB)</th><th class="p-3">Effective Date</th><th class="p-3">Status</th></tr></thead><tbody class="divide-y text-sm">';
      rates.forEach(r => {
        html += `<tr><td class="p-3 font-semibold">${r.fx_sources?.source_name || 'Bank'}</td><td class="p-3 font-bold text-blue-600">${r.currency_code}</td><td class="p-3">${r.rate_side}</td><td class="p-3 text-right font-mono">${Number(r.rate).toFixed(4)}</td><td class="p-3">${r.effective_date}</td><td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded">${r.verification_status}</span></td></tr>`;
      });
      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    async function loadBankComparison() {
      const { data: rates } = await supabaseClient.from('fx_rates').select('*, fx_sources(source_name)').eq('currency_code', 'USD');
      const container = document.getElementById('comparison-matrix');
      if (!rates || rates.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-500">No comparison data available yet. Please run the collection scraper.</p>';
        return;
      }
      let html = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-slate-100 text-slate-700 text-xs uppercase"><th class="p-3">Commercial Bank</th><th class="p-3 text-right">Buying Rate (ETB)</th><th class="p-3 text-right">Selling Rate (ETB)</th><th class="p-3">Effective Date</th></tr></thead><tbody class="divide-y text-sm">';
      
      const grouped = {};
      rates.forEach(r => {
        const bankName = r.fx_sources?.source_name || 'Unknown';
        if (!grouped[bankName]) grouped[bankName] = {};
        grouped[bankName][r.rate_side] = r.rate;
        grouped[bankName].date = r.effective_date;
      });

      for (const [bank, vals] of Object.entries(grouped)) {
        html += `<tr><td class="p-3 font-semibold">${bank}</td><td class="p-3 text-right font-mono">${vals.buy ? Number(vals.buy).toFixed(4) : '-'}</td><td class="p-3 text-right font-mono">${vals.sell ? Number(vals.sell).toFixed(4) : '-'}</td><td class="p-3">${vals.date || '-'}</td></tr>`;
      }
      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    async function triggerCollection() {
      const res = await fetch('/api/scrapers/collect', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        alert(`Collection successful! Collected ${data.collected_records} verified rates across NBE and commercial banks.`);
        loadLiveRates();
      } else {
        alert('Collection error: ' + (data.error || 'Unknown error'));
      }
    }

    async function downloadReport(format) {
      if (!currentUser) { alert('Please log in first.'); openAuthModal(); return; }
      const res = await fetch('/api/reports/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ report_type: 'DAILY_FX_REP', format, customer_id: currentUser.id })
      });
      if (res.ok) {
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ADEY_FX_Report.${format}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } else {
        alert('Report generation failed or access unauthorized.');
      }
    }

    function calculateImporter() {
      const amt = parseFloat(document.getElementById('imp-amount').value) || 0;
      const rate = parseFloat(document.getElementById('imp-rate').value) || 0;
      const total = amt * rate;
      document.getElementById('imp-result').innerHTML = `
        <div class="space-y-1">
          <div><strong>Standard ETB Equivalent:</strong> ${total.toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
          <div><strong>Scenario (+2% Volatility):</strong> ${(total * 1.02).toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
          <div><strong>Scenario (-2% Volatility):</strong> ${(total * 0.98).toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
        </div>
      `;
    }

    function calculateExporter() {
      const amt = parseFloat(document.getElementById('exp-amount').value) || 0;
      const rate = parseFloat(document.getElementById('exp-rate').value) || 0;
      const total = amt * rate;
      document.getElementById('exp-result').innerHTML = `
        <div class="space-y-1">
          <div><strong>Standard ETB Revenue:</strong> ${total.toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
          <div><strong>Scenario (+2% Rate):</strong> ${(total * 1.02).toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
          <div><strong>Scenario (-2% Rate):</strong> ${(total * 0.98).toLocaleString(undefined, {minimumFractionDigits: 2})} ETB</div>
        </div>
      `;
    }

    async function orderReport(productCode, price) {
      if (!currentUser) { alert('Please log in first.'); openAuthModal(); return; }
      const { data, error } = await supabaseClient.from('orders').insert({
        customer_id: currentUser.id,
        product_id: (await supabaseClient.from('products').select('id').eq('product_code', productCode).single()).data.id,
        amount: price,
        status: 'pending_payment'
      }).select().single();

      if (error) alert('Order error: ' + error.message);
      else { alert('Order created! Please complete payment and submit your receipt reference in the payment section.'); switchTab('reports'); }
    }

    async function submitPaymentProof() {
      if (!currentUser) { alert('Please log in first.'); return; }
      const ref = document.getElementById('pay-ref').value;
      const amt = parseFloat(document.getElementById('pay-amount').value);
      if (!ref || !amt) { alert('Please enter transaction reference and amount.'); return; }

      const { data: order } = await supabaseClient.from('orders').select('id').eq('customer_id', currentUser.id).eq('status', 'pending_payment').limit(1).single();
      if (!order) { alert('No pending order found. Please order a report first.'); return; }

      const { error } = await supabaseClient.from('payment_submissions').insert({
        order_id: order.id,
        customer_id: currentUser.id,
        payment_method: 'bank_transfer',
        transaction_reference: ref,
        receipt_path: 'receipts/mock_receipt.png',
        amount_claimed: amt,
        status: 'submitted'
      });

      if (error) alert('Submission failed: ' + error.message);
      else { alert('Payment receipt submitted successfully! Awaiting administrator verification.'); }
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); setAuthMode('signin'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
    function setAuthMode(mode) {
      const container = document.getElementById('auth-form-container');
      if (mode === 'signin') {
        document.getElementById('tab-signin').className = "w-1/2 pb-3 font-bold text-sm text-center border-b-2 border-amber-500 text-amber-600";
        document.getElementById('tab-signup').className = "w-1/2 pb-3 font-bold text-sm text-center border-b-2 border-transparent text-slate-400";
        container.innerHTML = `
          <div class="space-y-4 mt-4">
            <input type="email" id="auth-email" placeholder="Email Address" class="w-full px-3 py-2 border rounded-lg text-sm">
            <input type="password" id="auth-pass" placeholder="Password" class="w-full px-3 py-2 border rounded-lg text-sm">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm">Sign In</button>
          </div>
        `;
      } else {
        document.getElementById('tab-signup').className = "w-1/2 pb-3 font-bold text-sm text-center border-b-2 border-amber-500 text-amber-600";
        document.getElementById('tab-signin').className = "w-1/2 pb-3 font-bold text-sm text-center border-b-2 border-transparent text-slate-400";
        container.innerHTML = `
          <div class="space-y-4 mt-4">
            <input type="text" id="auth-name" placeholder="Full Name / Organization" class="w-full px-3 py-2 border rounded-lg text-sm">
            <input type="email" id="auth-email" placeholder="Email Address" class="w-full px-3 py-2 border rounded-lg text-sm">
            <input type="password" id="auth-pass" placeholder="Password" class="w-full px-3 py-2 border rounded-lg text-sm">
            <button onclick="handleSignUp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm">Create Account</button>
          </div>
        `;
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) alert('Login failed: ' + error.message);
      else { window.location.reload(); }
    }

    async function handleSignUp() {
      const name = document.getElementById('auth-name').value;
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      const { data, error } = await supabaseClient.auth.signUp({ email, password: pass, options: { data: { full_name: name, preferred_language: currentLang } } });
      if (error) alert('Registration failed: ' + error.message);
      else { alert('Registration successful! Please sign in.'); setAuthMode('signin'); }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    initApp();
  </script>
</body>
</html>
